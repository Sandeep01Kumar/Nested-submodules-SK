<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
    <!-- C-005: wire the sibling stylesheet (the original inert page loaded neither
         style.css nor app.js). style.css is a sibling of this file. -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Calculator</h2>

    <!-- Layout: controls on the left, calculation-history panel on the right.
         All ids/classes below form the shared DOM contract that app.js selects
         and style.css styles; they must not be renamed. -->
    <div class="calculator">
        <section class="calc-controls">
            <div class="operands">
                <label>a <input id="operand-a" type="number" inputmode="decimal" placeholder="0"></label>
                <label>b <input id="operand-b" type="number" inputmode="decimal" placeholder="0"></label>
            </div>

            <!-- Operator keypad. Each button carries the CANONICAL calculator-core
                 dispatch symbol in data-op (+, -, *, /, %, ^, √); the visible glyph
                 may be prettified (−, ×, ÷) but data-op stays canonical. %, ^ and √
                 are the new operations added by this feature. √ is unary, so app.js
                 disables #operand-b when it is selected. aria-label gives each
                 symbol-only control a descriptive accessible name. -->
            <div id="operators" class="operators">
                <button class="op-btn" data-op="+" type="button" aria-label="Add">+</button>
                <button class="op-btn" data-op="-" type="button" aria-label="Subtract">−</button>
                <button class="op-btn" data-op="*" type="button" aria-label="Multiply">×</button>
                <button class="op-btn" data-op="/" type="button" aria-label="Divide">÷</button>
                <button class="op-btn" data-op="%" type="button" aria-label="Modulus">%</button>
                <button class="op-btn" data-op="^" type="button" aria-label="Power">^</button>
                <button class="op-btn" data-op="√" type="button" aria-label="Square root">√</button>
            </div>

            <button id="equals" type="button" aria-label="Equals">=</button>

            <!-- Result is announced politely to assistive tech; starts at 0. -->
            <div id="result" class="result" aria-live="polite">0</div>
            <!-- Validation / computation errors surface here (role=alert), never
                 only in the console. -->
            <div id="error" class="error" role="alert" aria-live="polite"></div>
        </section>

        <aside class="history-panel">
            <div class="history-header">
                <h3>History</h3>
                <button id="clear-history" type="button">Clear History</button>
            </div>
            <!-- app.js fills this list newest-first with one .history-item per
                 recorded calculation (expression = result + timestamp). -->
            <ul id="history-list" class="history-list"></ul>
        </aside>
    </div>

    <!-- ===== calculator-core integration bridge (C-002): zero-dependency, no bundler, classic scripts =====
         The sibling calculator-core files are CommonJS + UMD-with-browser-globals, NOT ES modules, so we
         consume them via ordered CLASSIC <script> tags (never ES modules; no module-type scripts, no import). Order is load-bearing:
         classic scripts run top-to-bottom, synchronously, so every global exists before app.js runs. -->

    <!-- 1) Provide a throwaway CommonJS `module` shim so the pure-CommonJS math-engine
            files (each ends in `module.exports = fn;`) can run in the browser, and
            create the window.mathEngine namespace the calculator-core facade reads from. -->
    <script>window.mathEngine = {}; window.module = { exports: {} };</script>

    <!-- 2) Load each pure-CommonJS math-engine operation, then capture its export into
            window.mathEngine immediately (each op file overwrites module.exports). -->
    <script src="../calculator-core/math-engine/add.js"></script>
    <script>window.mathEngine.add = window.module.exports;</script>
    <script src="../calculator-core/math-engine/subtract.js"></script>
    <script>window.mathEngine.subtract = window.module.exports;</script>
    <script src="../calculator-core/math-engine/multiply.js"></script>
    <script>window.mathEngine.multiply = window.module.exports;</script>
    <script src="../calculator-core/math-engine/divide.js"></script>
    <script>window.mathEngine.divide = window.module.exports;</script>
    <script src="../calculator-core/math-engine/modulus.js"></script>
    <script>window.mathEngine.modulus = window.module.exports;</script>
    <script src="../calculator-core/math-engine/power.js"></script>
    <script>window.mathEngine.power = window.module.exports;</script>
    <script src="../calculator-core/math-engine/sqrt.js"></script>
    <script>window.mathEngine.sqrt = window.module.exports;</script>

    <!-- 3) CRITICAL: clear the CommonJS shim so the UMD files below take their BROWSER
            (else) branch. If window.module stays defined, history.js/calculator.js
            would detect Node (typeof module === 'object' && module.exports) and would
            NOT register window.calculatorHistory / window.calculatorCore — silently
            breaking the whole UI. -->
    <script>window.module = undefined;</script>

    <!-- 4) history.js self-registers window.calculatorHistory (UMD browser branch). -->
    <script src="../calculator-core/history.js"></script>

    <!-- 5) calculator.js reads window.mathEngine + window.calculatorHistory and
            registers window.calculatorCore. -->
    <script src="../calculator-core/calculator.js"></script>

    <!-- 6) app.js: the UI controller (classic script). Runs last so window.calculatorCore
            is already available. MUST be a classic script, never an ES module. -->
    <script src="app.js"></script>
</body>
</html>
